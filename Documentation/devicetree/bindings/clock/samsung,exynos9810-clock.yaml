%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/samsung,exynos9810-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos9810 SoC clock controller

maintainers:
  - Markuss Broks <markuss.broks@gmail.com>

description: |
  Exynos9810 clock controller is comprised of several CMU units, generating
  clocks for different domains. Each CMU is represented by a separate device
  tree node and consumes clocks generated by the top-level CMU.

properties:
  compatible:
    enum:
      - samsung,exynos9810-cmu-fsys0
      - samsung,exynos9810-cmu-peric0

  clocks:
    minItems: 3
    maxItems: 3

  clock-names:
    minItems: 3
    maxItems: 3

  "#clock-cells":
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - clocks
  - clock-names
  - "#clock-cells"
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos9810-cmu-fsys0
    then:
      properties:
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ufs
    else:
      properties:
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ip

additionalProperties: false

examples:
  - |
    clock-controller@10400000 {
        compatible = "samsung,exynos9810-cmu-peric0";
        reg = <0x10400000 0x8000>;
        clocks = <&oscclk>, <&peric0_bus>, <&peric0_ip>;
        clock-names = "oscclk", "bus", "ip";
        #clock-cells = <1>;
    };
